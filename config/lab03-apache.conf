# Apache VirtualHost configuration for Lab 03 — NovaTech Corp Briefing Portal

# Ensure Apache listens on port 8083
Listen 8083

# Intentional: Server tokens reveal version (adds realism to lab scenario)
# NOTE: ServerTokens and ServerSignature are global directives — must be outside VirtualHost
ServerTokens Full
ServerSignature On

<VirtualHost *:8083>
    ServerName novatech.local
    DocumentRoot /srv/labs/lab03/public

    # Public web root
    <Directory /srv/labs/lab03/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Defense-in-Depth: Deny direct web access to data/ directory
    <Directory /srv/labs/lab03/data>
        Require all denied
    </Directory>

    # Defense-in-Depth: Deny web access to internal/ directory
    # (internal metadata service only reachable via loopback, not Apache)
    <Directory /srv/labs/lab03/internal>
        Require all denied
    </Directory>

    # Pass all PHP scripts to dedicated lab03 PHP-FPM pool socket
    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php-fpm/lab03.sock|fcgi://localhost"
    </FilesMatch>

    ErrorLog /var/log/httpd/lab03_error.log
    CustomLog /var/log/httpd/lab03_access.log combined
</VirtualHost>
