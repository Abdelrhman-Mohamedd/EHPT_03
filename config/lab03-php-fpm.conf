; /etc/php-fpm.d/lab03.conf — NovaTech Corp briefing portal (Lab 03)
; This is a minimal config — the briefing portal has NO vulnerable code.
; All lab challenges are purely network-level (SSH tunneling, pivoting).
[lab03]
user  = lab03
group = lab03
listen = /run/php-fpm/lab03.sock
listen.owner = apache
listen.group = lab03
listen.mode  = 0660

pm = dynamic
pm.max_children    = 5
pm.start_servers   = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

php_admin_value[open_basedir] = /srv/labs/lab03:/tmp
php_admin_value[session.save_path] = /srv/labs/lab03/sessions
php_flag[display_errors] = Off
php_admin_value[expose_php] = Off
php_admin_value[disable_functions] = exec,shell_exec,system,passthru,popen
php_admin_value[max_execution_time] = 15
php_admin_value[memory_limit] = 64M
